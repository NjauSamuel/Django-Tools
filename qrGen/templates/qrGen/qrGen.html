{% extends 'base.html' %}

{% block content %}
<section class="bg-gray-50 dark:bg-gray-800 min-h-[80vh] py-12 pt-20">
    <div class="max-w-4xl mx-auto px-4">

        <!-- QR Code Display Section -->
        <div id="qr-result" class="bg-white dark:bg-gray-900 rounded-lg shadow-lg p-8 border border-gray-200 dark:border-gray-700 mb-8 hidden">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-6 text-center">
                Your QR Code
            </h1>
            <div class="flex flex-col items-center">
                <!-- QR Code Container -->
                <div class="bg-white rounded-lg p-6 mb-6 border border-gray-200 dark:border-gray-300 inline-block">
                    <div id="qr-output"></div>
                </div>

                <!-- Value display -->
                <div class="w-full max-w-md mb-6">
                    <div class="bg-gray-50 dark:bg-gray-800 rounded-lg p-3 border border-gray-200 dark:border-gray-700">
                        <p id="qr-value-display" class="text-sm text-gray-600 dark:text-gray-400 text-center break-all"></p>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row gap-3 w-full max-w-md">
                    <button id="download-png-btn" onclick="downloadQR()" class="flex-1 inline-flex items-center justify-center px-5 py-3 text-base font-medium text-center text-white rounded-lg bg-green-600 hover:bg-green-700 focus:ring-4 focus:ring-green-300 dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800 transition-colors">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        Save as PNG
                    </button>
                    <button id="copy-img-btn" onclick="copyQRImage()" class="flex-1 inline-flex items-center justify-center px-5 py-3 text-base font-medium text-center text-blue-700 rounded-lg border border-blue-700 bg-transparent hover:bg-blue-100 hover:text-blue-800 focus:ring-4 focus:ring-blue-300 dark:border-blue-500 dark:text-blue-400 dark:hover:bg-gray-800 dark:hover:text-blue-300 dark:focus:ring-blue-800 transition-colors">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                        <span id="copy-btn-text">Copy Image</span>
                    </button>
                </div>

                <!-- Copy feedback -->
                <div id="copy-feedback" class="mt-3 hidden">
                    <span class="text-green-600 dark:text-green-400 text-sm font-medium flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        Copied to clipboard!
                    </span>
                </div>
            </div>
        </div>

        <!-- QR Code Generator Form Section -->
        <div class="bg-white dark:bg-gray-900 rounded-lg shadow-lg p-8 border border-gray-200 dark:border-gray-700">
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-6 text-center">Generate QR Code</h2>
            <form id="qr-form" class="space-y-6" onsubmit="generateQR(event)">
                <!-- Value Input -->
                <div>
                    <label for="qr-value" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                        URL or Text
                    </label>
                    <input type="text" id="qr-value" placeholder="Enter a URL or text (e.g., https://example.com)" required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                </div>

                <!-- Error Correction Level -->
                <div>
                    <label for="qr-correction" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                        Error Correction Level
                    </label>
                    <select id="qr-correction" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                        <option value="L">L - Low (7% recovery)</option>
                        <option value="M" selected>M - Medium (15% recovery)</option>
                        <option value="Q">Q - Quartile (25% recovery)</option>
                        <option value="H">H - High (30% recovery)</option>
                    </select>
                    <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Higher correction allows the QR code to be read even if partially damaged.</p>
                </div>

                <!-- Size Selection -->
                <div>
                    <label for="qr-size" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                        Size
                    </label>
                    <select id="qr-size" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                        <option value="128">Small (128 x 128)</option>
                        <option value="256" selected>Medium (256 x 256)</option>
                        <option value="512">Large (512 x 512)</option>
                        <option value="1024">Extra Large (1024 x 1024)</option>
                    </select>
                </div>

                <!-- Color Options -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="qr-fg-color" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Foreground Color
                        </label>
                        <div class="flex items-center gap-3">
                            <input type="color" id="qr-fg-color" value="#000000" class="w-10 h-10 rounded border border-gray-300 cursor-pointer">
                            <input type="text" id="qr-fg-hex" value="#000000" maxlength="7" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white font-mono">
                        </div>
                    </div>
                    <div>
                        <label for="qr-bg-color" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Background Color
                        </label>
                        <div class="flex items-center gap-3">
                            <input type="color" id="qr-bg-color" value="#ffffff" class="w-10 h-10 rounded border border-gray-300 cursor-pointer">
                            <input type="text" id="qr-bg-hex" value="#ffffff" maxlength="7" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white font-mono">
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full inline-flex items-center justify-center px-5 py-3 text-base font-medium text-center text-white rounded-lg bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800 transition-colors">
                    Generate QR Code
                    <svg class="w-5 h-5 ml-2 -mr-1" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</section>

<!-- QR Code generation library (qrcodejs) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// Sync color picker with hex input
document.getElementById('qr-fg-color').addEventListener('input', function() {
    document.getElementById('qr-fg-hex').value = this.value;
});
document.getElementById('qr-fg-hex').addEventListener('input', function() {
    if (/^#[0-9A-Fa-f]{6}$/.test(this.value)) {
        document.getElementById('qr-fg-color').value = this.value;
    }
});
document.getElementById('qr-bg-color').addEventListener('input', function() {
    document.getElementById('qr-bg-hex').value = this.value;
});
document.getElementById('qr-bg-hex').addEventListener('input', function() {
    if (/^#[0-9A-Fa-f]{6}$/.test(this.value)) {
        document.getElementById('qr-bg-color').value = this.value;
    }
});

// QR Code instance
let qrInstance = null;

// Pre-fill input from URL parameter (from home page "Advanced Options")
const urlParams = new URLSearchParams(window.location.search);
const prefilledValue = urlParams.get('value');
if (prefilledValue) {
    document.getElementById('qr-value').value = prefilledValue;
}

// Map correction levels
const correctionLevels = {
    'L': QRCode.CorrectLevel.L,
    'M': QRCode.CorrectLevel.M,
    'Q': QRCode.CorrectLevel.Q,
    'H': QRCode.CorrectLevel.H,
};

function generateQR(event) {
    event.preventDefault();

    const value = document.getElementById('qr-value').value.trim();
    if (!value) return;

    const correction = document.getElementById('qr-correction').value;
    const size = parseInt(document.getElementById('qr-size').value);
    const fgColor = document.getElementById('qr-fg-color').value;
    const bgColor = document.getElementById('qr-bg-color').value;

    const outputDiv = document.getElementById('qr-output');
    const resultSection = document.getElementById('qr-result');

    // Clear previous QR code
    outputDiv.innerHTML = '';

    // Create new QR code
    qrInstance = new QRCode(outputDiv, {
        text: value,
        width: size,
        height: size,
        colorDark: fgColor,
        colorLight: bgColor,
        correctLevel: correctionLevels[correction] || QRCode.CorrectLevel.M,
    });

    // Update value display
    document.getElementById('qr-value-display').textContent = value;

    // Show result section
    resultSection.classList.remove('hidden');

    // Scroll to result
    resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function downloadQR() {
    const img = document.querySelector('#qr-output img');
    if (!img) return;

    const link = document.createElement('a');
    link.download = 'qrcode.png';
    link.href = img.src;
    link.click();
}

function copyQRImage() {
    const canvas = document.querySelector('#qr-output canvas');
    if (!canvas) return;

    canvas.toBlob(function(blob) {
        const item = new ClipboardItem({ 'image/png': blob });
        navigator.clipboard.write([item]).then(function() {
            // Show feedback
            const feedback = document.getElementById('copy-feedback');
            const btnText = document.getElementById('copy-btn-text');
            feedback.classList.remove('hidden');
            btnText.textContent = 'Copied!';
            setTimeout(function() {
                feedback.classList.add('hidden');
                btnText.textContent = 'Copy Image';
            }, 2000);
        }).catch(function() {
            alert('Unable to copy. Try downloading instead.');
        });
    });
}
</script>
{% endblock %}
